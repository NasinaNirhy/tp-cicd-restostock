name: CI/CD Pipeline - Resto Stock

on:
  push:
    branches: [ "main", "feature/version-api" ]
  pull_request:
    branches: [ "main", "feature/version-api" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source (Checkout)
        uses: actions/checkout@v4

      - name: Configuration de l'environnement Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécution des tests automatisés (Pytest)
        run: |
          python -m pytest -q